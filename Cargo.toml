[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/infra",
    "crates/app",
    "crates/api-http",
    "xtask",
]
default-members = [
    "crates/domain",
    "crates/infra",
    "crates/app",
    "crates/api-http",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.83"          # RPITIT + async fn nativo em trait + precise capturing
license = "MIT"

# Dependências centralizadas. Cada crate herda com `workspace = true`, de modo que
# a versão de uma lib apareça uma vez só no repositório.
#
# A tabela de referência é tmp/architecture/setup.md. Cinco entradas estão à
# frente do que ela pinou (tower-http, jsonwebtoken, config, mockall): a doc foi
# escrita quando aquelas eram as correntes, e o que ela especifica é a
# arquitetura, não a versão. O driver do banco ela pinou como sqlx, que saiu —
# ver `docs/adr/0012-driver-mariadb-sem-construtor-de-query.md`.
[workspace.dependencies]
# --- runtime / transporte ---------------------------------------------------
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
futures = "0.3"
# Gera a variante `Send` das traits com `async fn`. Necessário porque um port
# alcançado por generic (P: AppProvider) tem retorno opaco: o compilador não
# consegue inferir `Send`, e o axum exige. Ver tmp/architecture/lifetimes-auto-traits.md.
trait-variant = "0.1"

# --- wire -------------------------------------------------------------------
# planus compila os .fbs em Rust puro: nada de flatc, no build ou em produção.
planus = "1"

# Cookies tipados: construção com SameSite/Max-Age e o parser de Cookie:.
# Escrever isso à mão custou um parser próprio e cookies como String solta.
cookie = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- persistência / cache ---------------------------------------------------
# O driver do MariaDB, sem pool nem construtor de query embutidos — os dois vinham
# no sqlx, e nenhum dos dois estava sendo usado como o sqlx os oferece.
#
# `default-rustls-ring` em vez do `default`: o conjunto padrão pede `flate2/zlib`,
# que é a zlib em C, e o build multi-stage do Dockerfile não tem toolchain C de
# propósito — foi por isso que o jsonwebtoken ficou em `rust_crypto`. Este perfil
# troca a compressão pela implementação em Rust puro e mantém o TLS em rustls
# sobre `ring`, que é o provider que o resto da árvore já usa.
#
# Sem a feature `chrono`: nenhuma coluna é de data. O tempo é `BIGINT` com epoch
# em milissegundos, e quem o transforma em `DateTime<Utc>` é a entity — o driver
# não precisa conhecer o tipo.
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
moka = { version = "0.12", features = ["future"] }
# O cache de view guarda a View, não JSON: o formato é interno ao processo e
# ninguém o lê de fora. bincode é menor e mais rápido, e uma entrada de formato
# anterior é tratada como ausência — o mesmo que já se fazia com o JSON.
bincode = { version = "2", features = ["serde"] }

# --- domínio ----------------------------------------------------------------
# nutype SEM a feature serde: o domain valida, não serializa.
nutype = "0.5"
argon2 = { version = "0.5", features = ["std"] }
base62 = "2"
base64 = "0.22"            # token de cursor keyset (base64url, sem padding)
# Gerador thread-safe: o estado mora num AtomicU64 e `generate` toma `&self`.
# A alternativa (rs-snowflake) exige `&mut self`, o que obrigava a embrulhar o
# gerador num std::sync::Mutex — tipo banido em .clippy.toml — e a justificar o
# desvio com quatro `#[allow]`.
snowflaked = { version = "1", features = ["sync"] }   # dep OPCIONAL da feature `id-snowflake`
nanoid = "0.5"                 # id opaco: refresh token, filename de imagem
xxhash-rust = { version = "0.8", features = ["xxh64"] }   # chave de marker
xid = "1"                      # id ordenável fora do banco (request_id)

# --- borda / apresentação ---------------------------------------------------
# `rust_crypto` e não `aws_lc_rs`: a versão 11 exige escolher um provider
# explicitamente, e o puro-Rust dispensa toolchain C — o que mantém o build
# multi-stage do Dockerfile enxuto. Sem `use_pem`: só assinamos com HS256, e o
# PEM só serve para chave assimétrica.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
config = "0.15"
secrecy = { version = "0.10", features = ["serde"] }

# --- transversais -----------------------------------------------------------
# Registro em tempo de link: cada contexto por tarefa se declara no próprio
# arquivo, e o dono do escopo não importa nenhum deles. Sem isso, o `scope/`
# ganharia uma linha e um nível de aninhamento por contexto novo.
linkme = "0.3"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
unicode-normalization = "0.1"

# --- teste ------------------------------------------------------------------
mockall = "0.15"
pretty_assertions = "1"
fake = { version = "3", features = ["derive", "chrono"] }
tokio-test = "0.4"

# Lints comuns aos quatro crates. Cada um herda com `[lints] workspace = true`.
#
# `async_fn_in_trait` avisa que a trait não consegue *especificar* o bound de
# `Send` do futuro. Isso importa aqui, e a inferência automática **não** resolve:
# ela funciona sobre um tipo concreto, mas o `api-http` alcança os casos de uso
# por um genérico (`router<P: AppProvider>`), onde o retorno é opaco e `Send` não
# tem como ser provado. Um `async fn` cru numa trait de port faz todo handler do
# axum deixar de compilar — a três camadas de distância da causa.
#
# A saída é a que tmp/architecture/lifetimes-auto-traits.md prescreve:
# `#[trait_variant::make(Send)]` nos ports assíncronos, e `+ Send + Sync` no
# retorno dos factories. `deny` é o que impede alguém de reintroduzir o problema.
[workspace.lints.rust]
async_fn_in_trait = "deny"

# Os links de doc são navegação, e navegação quebrada é pior que ausente: um
# `[`Coisa`]` que não resolve some do HTML como texto simples, sem aviso para
# quem lê. A migração para um export por módulo quebrou 21 deles de uma vez —
# todo item que mudou de caminho levou junto os links que o nomeavam — e nada
# apontou, porque `cargo doc` não estava no portão. Agora está, e estes três
# lints são o que ele confere.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"

# Os grupos A–F de tmp/clippy.md. O CI roda com `-D warnings`, então aqui não há
# diferença prática entre `warn` e `deny`: os dois quebram o build. O nível ainda
# vale como declaração de intenção — `deny` é regra de arquitetura, `warn` é
# higiene — e como diferença real no editor de quem está escrevendo.
#
# O que está em `allow` está em `allow` por medida, não por comodismo: cada um
# foi ligado, contado e desligado com o motivo escrito ao lado.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

module_name_repetitions = "allow"
must_use_candidate = "allow"
type_complexity = "allow"

# O `missing_docs` do rustc só enxerga item **público**, e a maior parte do que
# se escreve aqui não é: são 69 arquivos em `intern/` e o `api-http` inteiro,
# que é `pub(crate)`. Sem este lint, nada no compilador cobre a camada de
# apresentação nem uma única implementação — foram 352 itens sem doc quando a
# passada começou, e o compilador não tinha uma palavra a dizer sobre nenhum.
#
# Vale para campo, const e função privados. O par dele é a regra de que
# comentário `//` não passa de uma linha: o racional que sobraria no corpo sobe
# para o `///`, e é este lint que garante que exista um `///` para onde subir.
missing_docs_in_private_items = "deny"

# A prosa é em pt-BR e a seção `# Errors` é convenção de rustdoc em inglês, que
# este projeto não segue: o que cada erro significa já está escrito no doc da
# função, em português. Eram 28 achados, todos com a falha já documentada.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Grupo A: Disciplina async / task-local
await_holding_refcell_ref = "deny"
await_holding_lock = "deny"
await_holding_invalid_type = "deny"
significant_drop_in_scrutinee = "deny"

# tmp/clippy.md queria este lint como canário de `!Send` antes da borda do
# router. Ele não serve para esta arquitetura, e vale registrar por quê.
#
# O lint prova `Send` no corpo de cada função. Aqui **todo** caminho assíncrono é
# genérico sobre suas dependências — é o que a DI estática significa — e dentro
# de um corpo genérico `Send` de um parâmetro de tipo não é provável: `S` só
# ganha um tipo concreto na monomorfização. Resultado: ~45 acusações, todas em
# futuros que **são** `Send` no ponto de uso, e nenhuma verdadeira. Um lint que
# só produz falso positivo deixa de ser lido.
#
# A garantia de verdade está em outro lugar, e é mais forte: os dois testes de
# app/src/lib.rs que não rodam nada e só precisam compilar, passando o caso de
# uso por um `tokio::spawn` — que exige `Send + 'static` sobre o tipo concreto.
# Se um port passar a segurar algo `!Send` através de um `.await`, aqueles dois
# param de compilar. É a convenção 1 do handoff, e continua valendo.
future_not_send = "allow"

# Nursery de gosto discutível: troca um `if let/else` legível por um
# `map_or_else` com dois fechamentos, e no caso do argon2 o `_` do erro fica
# menos claro que o `Err(_)` escrito por extenso.
option_if_let_else = "allow"

# Este entra em conflito direto com o Single Export Pattern, e o padrão ganha.
#
# O lint reclama de `pub(crate) struct X` dentro de um `pub(crate) mod intern`:
# como o módulo já limita o alcance, o `pub(crate)` do item seria redundante e
# ele pede um item privado. Mas é justamente esse `pub(crate)` que **declara**
# qual é o item exportado do arquivo — é o que o `cargo xtask lint-exports`
# conta, e é o que diz a quem lê "isto atravessa a fronteira do módulo, o resto
# não". Removê-lo deixaria todo arquivo de `intern/` com zero export declarado,
# e a regra do repositório perderia o que ela mede.
redundant_pub_crate = "allow"

# É o padrão da UnitOfWork, não um descuido: o guard da transação precisa viver
# até o fim da query, e o lint pede para soltá-lo antes. Eram 32 achados, todos
# o mesmo `let mut transaction = …current().await?` seguido do `execute`.
significant_drop_tightening = "allow"

# Grupo C: Blindagem de pânico
#
# Medido antes de promover: com `allow-*-in-tests` no .clippy.toml, o grupo
# inteiro rendeu 19 achados, dos quais 14 em `#[cfg(test)]`, 4 provavelmente
# inofensivos (somas de capacidade, `UNIX_EPOCH + Duration`) e **1 bug de
# verdade** — `(page - 1) * limit` estourando o u32 com um `?page=` grande, em
# infra/src/query/dql/account.rs. Foi por isso que `arithmetic_side_effects`
# ficou em `deny` e não em `warn`, ao contrário do que o plano previa: o lint se
# pagou na primeira execução.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
panic_in_result_fn = "deny"
unwrap_in_result = "deny"
mem_forget = "deny"
exit = "deny"

# Grupo D: Logging só via tracing
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
use_debug = "warn"

# Grupo F: Legibilidade de erros e supressões
allow_attributes_without_reason = "deny"
wildcard_imports = "warn"
enum_glob_use = "warn"
semicolon_if_nothing_returned = "warn"
self_named_module_files = "warn"
missing_const_for_fn = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
