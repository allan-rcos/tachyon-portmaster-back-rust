# Development stack: MariaDB persisted on disk, auto-migrated and auto-seeded,
# with the API in front. (The integration tests do NOT use this file —
# testcontainers-go stands up its own tmpfs MariaDB + API pool, from the same
# Dockerfile.)
services:
  db:
    image: mariadb:11
    # O servidor inteiro em UTC, e não só a sessão da API.
    #
    # Nenhuma linha depende disso: as colunas de tempo são `BIGINT` com epoch em
    # milissegundos, escritas pela aplicação e pelo seed, e não há `DEFAULT
    # CURRENT_TIMESTAMP` em lugar nenhum do schema. Fica como rede, para que um
    # `mysql` aberto à mão e um `NOW()` digitado numa investigação respondam no
    # mesmo fuso que a aplicação usa.
    command: --default-time-zone=+00:00
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: portmaster
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      # Initialising a fresh on-disk volume takes minutes on a slow disk, and
      # without this the retry budget is spent before MariaDB ever finishes —
      # the stack then fails with "db is unhealthy" on a database that was
      # simply still starting. start_period keeps those attempts from counting.
      #
      # 300s and not 180s: measured at 280s on an external drive, which is under
      # the old budget by less than the margin of a slower one. The number only
      # delays when failures start counting — a database that answers early is
      # marked healthy immediately — so being generous here costs nothing and
      # being tight costs a stack that will not come up.
      start_period: 300s

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=mysql://root:root@tcp(db:3306)/portmaster?multiStatements=true"
      - "up"
    restart: "no"

  seed:
    image: mariadb:11
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./db/seeds:/seeds:ro
    entrypoint:
      - "sh"
      - "-c"
      - "mariadb -h db -u root -proot portmaster < /seeds/dev.sql"
    restart: "no"

  app:
    build:
      context: .
      args:
        # This stack serves plain HTTP, and the session cookies are `Secure` in
        # a release build. Without this the browser keeps them and never sends
        # them back, so logging in locally would silently do nothing.
        RUST_DEBUG_ASSERTIONS: "on"
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      # No worker count: the API is a single process and tokio sizes its own
      # thread pool from the machine. The PHP stack forked four workers, which is
      # also why the runtime registries used to need a database to share.
      APP_DB_HOST: db
      APP_DB_PORT: "3306"
      APP_DB_NAME: portmaster
      APP_DB_USER: root
      APP_DB_PASSWORD: root
      # At least 32 bytes: HS256 refuses a secret shorter than its digest.
      APP_JWT_SECRET: dev-only-change-me-32-bytes-minimum
    ports:
      - "8000:8000"

volumes:
  db_data:
