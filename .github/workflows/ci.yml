name: CI

# Only what is landing on main. The Go job builds an image and restarts a
# container per test, so running it on every push to every branch spent most of
# its budget on work-in-progress that nobody was waiting on. A branch still gets
# checked before it merges, through the pull_request trigger.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # A warning that only appears locally is a warning nobody fixes.
  RUSTFLAGS: -D warnings

env:
  # Fixado na versão que os módulos de dagger/ declaram no dagger.json. Um CLI
  # mais novo que o engine contra o qual eles foram gerados reexecuta o codegen
  # no meio do job.
  DAGGER_VERSION: "0.21.8"

jobs:
  # fmt, clippy, lint-exports, doc e testes eram cinco passos com um setup de
  # toolchain próprio. São um `dagger call ci` agora, e o mesmo comando roda na
  # máquina de quem desenvolve — que antes não tinha como reproduzir nada disto
  # sem um push.
  #
  # A ordem continua deliberada e continua documentada, só que em dagger/ci.go:
  # formatação primeiro porque é instantânea, clippy depois porque compila, e os
  # testes por último. Um erro de formatação não deve custar uma compilação
  # inteira para aparecer.
  rust:
    name: fmt, clippy, doc, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar o Dagger
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="${DAGGER_VERSION}" BIN_DIR=/usr/local/bin sudo -E sh
          dagger version

      - name: Verificar
        working-directory: dagger
        run: dagger call ci

  go-integration:
    name: Go integration (FlatBuffers, testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: tests/integration/go.sum

      - name: Instalar o Dagger
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="${DAGGER_VERSION}" BIN_DIR=/usr/local/bin sudo -E sh

      # O flatc saiu daqui: dagger/modules/codegen traz o seu, fixado num lugar
      # só. E `check-fbs-go` regenera e compara DENTRO do container, então a
      # checagem não suja a árvore de trabalho antes de a suíte rodar — o antigo
      # `generate && git diff --exit-code` sujava.
      - name: Os bindings Go estão em dia?
        working-directory: dagger
        run: dagger call check-fbs-go

      # Chamado direto, e não por `dagger call integration-test`: o runner já tem
      # um daemon Docker, e passar pela função aninharia um segundo daemon dentro
      # do engine. A função existe para rodar a suíte num laptop.
      - name: Suíte de integração
        working-directory: tests/integration
        run: go test ./... -count=1 -timeout 20m
